{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ produto.nome }} - Jardim da Diana</title>
    
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/product_view.css' %}"> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <link rel="icon" type="image/png" href="{% static 'src/diana.png' %}" sizes="180x180"/>
</head>
<body>

    {% include 'produtos/header.html' %}

    <main class="main-container">
        <div class="product-detail-card">
            
            <div class="product-image-container">
                {% if produto.imagem %}
                    <img src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">
                {% else %}
                    <img src="{% static 'src/placeholder.png' %}" alt="Imagem não disponível">
                {% endif %}
            </div>

            <div class="product-info-container">
                <span class="product-category-badge">{{ produto.categoria.nome }}</span>
                <h1 class="product-title">{{ produto.nome }}</h1>
                <p class="product-description">{{ produto.descricao }}</p>
                
                <div class="product-purchase-section">
                    <p class="product-price">R$ {{ produto.preco|floatformat:2 }}</p>
                    <div class="product-actions">
                        <button class="btn btn-primary">
                            <i class="fa-solid fa-bag-shopping"></i>
                            Adicionar à Sacola
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>
    
    {% include 'produtos/footer.html' %}

    <script src="{% static 'js/menu.js' %}"></script>
</body>
</html>
